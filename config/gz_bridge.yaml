# gz topic published by Sensors plugin
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Front bumper contact sensors (gz contact -> ROS). Note: this is the sim-only
# representation; the physical robot publishes /bumper (vacuum_ros2_bridge/Bumper).
#
# gz-sim ignores a contact sensor's <topic> and publishes ONLY to the auto-scoped
# name below, so gz_topic_name must be the full scoped path. It couples to:
#   world "default"      - both test_room.world and living_room.world use it
#   model "oomwoo_one"   - the spawn -name (this bridge is oomwoo_one-specific)
#   link  "base_footprint" - the canonical root after fixed-joint lumping
# The world must also load gz-sim-contact-system or these stay silent (see
# urdf/plugins.xacro). test/test_bumper_wiring.py checks these names still match.
- ros_topic_name: "bumper_left/contact"
  gz_topic_name: "/world/default/model/oomwoo_one/link/base_footprint/sensor/bumper_left/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "bumper_right/contact"
  gz_topic_name: "/world/default/model/oomwoo_one/link/base_footprint/sensor/bumper_right/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

# Side distance sensors (single-ray gpu_lidar -> ROS). Sim representation of the
# short-range side wall sensors; on the physical robot these are ToF distance
# sensors (vacuum_ros2_bridge, sensor_msgs/Range). gz honours the sensor <topic>,
# so the gz topic is the plain name set in urdf/plugins.xacro.
- ros_topic_name: "range_left"
  gz_topic_name: "range_left"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "range_right"
  gz_topic_name: "range_right"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Front multizone ToF depth sensor (16x8 gpu_lidar -> PointCloud2). Sim of two
# VL53L7CX ToF arrays; gz publishes the point grid on tof_front/points. On the
# physical robot these are per-zone ToF ranges.
- ros_topic_name: "tof_front/points"
  gz_topic_name: "tof_front/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Front stereo cameras (gz camera -> ROS Image + CameraInfo). OV5647-equivalent
# RGB, VGA, wide FoV, for obstacle recognition / future stereo depth. gz derives
# the camera_info topic from the image topic (.../image -> .../camera_info).
- ros_topic_name: "camera_left/image"
  gz_topic_name: "camera_left/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "camera_left/camera_info"
  gz_topic_name: "camera_left/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "camera_right/image"
  gz_topic_name: "camera_right/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "camera_right/camera_info"
  gz_topic_name: "camera_right/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
